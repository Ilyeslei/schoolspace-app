name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create minimal Xcode project
        run: |
          # Create a proper Xcode project structure
          mkdir -p SchoolSpaceApp.xcodeproj
          cat > SchoolSpaceApp.xcodeproj/project.pbxproj << "EOF"
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              /* Begin PBXProject section */
              1DEB91FE2A6C1C3F00E4D1E4 /* Project object */ = {
                isa = PBXProject;
                attributes = {
                  LastSwiftUpdateCheck = 1600;
                  LastUpgradeCheck = 1600;
                  TargetAttributes = {
                    1DEB91FF2A6C1C3F00E4D1E4 = {
                      CreatedOnToolsVersion = 16.0;
                    };
                  };
                };
                buildConfigurationList = 1DEB92022A6C1C3F00E4D1E4;
                compatibilityVersion = "Xcode 15.0";
                developmentRegion = en;
                hasScannedForEncodings = 0;
                knownRegions = (
                  en,
                  Base,
                );
                mainGroup = 1DEB91FD2A6C1C3F00E4D1E4;
                productRefGroup = 1DEB920C2A6C1C3F00E4D1E4;
                projectDirPath = "";
                projectRoot = "";
                targets = (
                  1DEB91FF2A6C1C3F00E4D1E4,
                );
              };
              /* End PBXProject section */
              /* Begin XCBuildConfiguration section */
              1DEB92002A6C1C3F00E4D1E4 /* Debug */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ANALYZER_NONNULL = YES;
                  CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES;
                  CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                  CLANG_CXX_LIBRARY = "libc++";
                  CLANG_ENABLE_MODULES = YES;
                  CLANG_ENABLE_OBJC_ARC = YES;
                  CLANG_ENABLE_OBJC_WEAK = YES;
                  CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING = YES;
                  CLANG_WARN_BOOL_CONVERSION = YES;
                  CLANG_WARN_COMMA = YES;
                  CLANG_WARN_CONSTANT_CONVERSION = YES;
                  CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATION = YES;
                  CLANG_WARN_DIRECT_OBJC_ISA_USAGE = YES_ERROR;
                  CLANG_WARN_DOCUMENTATION_COMMENTS = YES;
                  CLANG_WARN_EMPTY_BODY = YES;
                  CLANG_WARN_ENUM_CONVERSION = YES;
                  CLANG_WARN_INFINITE_RECURSION = YES;
                  CLANG_WARN_INT_CONVERSION = YES;
                  CLANG_WARN_NON_LITERAL_NULL_CONVERSION = YES;
                  CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF = YES;
                  CLANG_WARN_OBJC_LITERAL_CONVERSION = YES;
                  CLANG_WARN_OBJC_ROOT_CLASS = YES_ERROR;
                  CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;
                  CLANG_WARN_RANGE_LOOP_ANALYSIS = YES;
                  CLANG_WARN_STRICT_PROTOTYPES = YES;
                  CLANG_WARN_SUSPICIOUS_MOVE = YES;
                  CLANG_WARN_UNREACHABLE_CODE = YES;
                  CLANG_WARN__DUPLICATE_METHOD_MATCH = YES;
                  CODE_SIGN_STYLE = Automatic;
                  COPY_PHASE_STRIP = NO;
                  DEBUG_INFORMATION_FORMAT = dwarf;
                  ENABLE_STRICT_OBJC_MSGSEND = YES;
                  ENABLE_TESTABILITY = YES;
                  GCC_C_LANGUAGE_STANDARD = gnu11;
                  GCC_DYNAMIC_NO_PIC = NO;
                  GCC_NO_COMMON_BLOCKS = YES;
                  GCC_OPTIMIZATION_LEVEL = 0;
                  GCC_PREPROCESSOR_DEFINITIONS = (
                    "DEBUG=1",
                    "$(inherited)",
                  );
                  GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
                  GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
                  GCC_WARN_UNDECLARED_SELECTOR = YES;
                  GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                  GCC_WARN_UNUSED_FUNCTION = YES;
                  GCC_WARN_UNUSED_VARIABLE = YES;
                  IPHONEOS_DEPLOYMENT_TARGET = 26.0;
                  MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
                  MTL_FAST_MATH = YES;
                  ONLY_ACTIVE_ARCH = YES;
                  SDKROOT = iphoneos;
                  SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG;
                  SWIFT_EMIT_LOC_STRINGS = YES;
                  SWIFT_OPTIMIZATION_LEVEL = "-Onone";
                  SWIFT_VERSION = 6.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                };
                name = Debug;
              };
              1DEB92012A6C1C3F00E4D1E4 /* Release */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ANALYZER_NONNULL = YES;
                  CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES;
                  CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                  CLANG_CXX_LIBRARY = "libc++";
                  CLANG_ENABLE_MODULES = YES;
                  CLANG_ENABLE_OBJC_ARC = YES;
                  CLANG_ENABLE_OBJC_WEAK = YES;
                  CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING = YES;
                  CLANG_WARN_BOOL_CONVERSION = YES;
                  CLANG_WARN_COMMA = YES;
                  CLANG_WARN_CONSTANT_CONVERSION = YES;
                  CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATION = YES;
                  CLANG_WARN_DIRECT_OBJC_ISA_USAGE = YES_ERROR;
                  CLANG_WARN_DOCUMENTATION_COMMENTS = YES;
                  CLANG_WARN_EMPTY_BODY = YES;
                  CLANG_WARN_ENUM_CONVERSION = YES;
                  CLANG_WARN_INFINITE_RECURSION = YES;
                  CLANG_WARN_INT_CONVERSION = YES;
                  CLANG_WARN_NON_LITERAL_NULL_CONVERSION = YES;
                  CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF = YES;
                  CLANG_WARN_OBJC_LITERAL_CONVERSION = YES;
                  CLANG_WARN_OBJC_ROOT_CLASS = YES_ERROR;
                  CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;
                  CLANG_WARN_RANGE_LOOP_ANALYSIS = YES;
                  CLANG_WARN_STRICT_PROTOTYPES = YES;
                  CLANG_WARN_SUSPICIOUS_MOVE = YES;
                  CLANG_WARN_UNREACHABLE_CODE = YES;
                  CLANG_WARN__DUPLICATE_METHOD_MATCH = YES;
                  CODE_SIGN_STYLE = Automatic;
                  COPY_PHASE_STRIP = NO;
                  DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
                  ENABLE_STRICT_OBJC_MSGSEND = YES;
                  GCC_C_LANGUAGE_STANDARD = gnu11;
                  GCC_DYNAMIC_NO_PIC = NO;
                  GCC_NO_COMMON_BLOCKS = YES;
                  GCC_OPTIMIZATION_LEVEL = s;
                  GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
                  GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
                  GCC_WARN_UNDECLARED_SELECTOR = YES;
                  GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                  GCC_WARN_UNUSED_FUNCTION = YES;
                  GCC_WARN_UNUSED_VARIABLE = YES;
                  IPHONEOS_DEPLOYMENT_TARGET = 26.0;
                  MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
                  MTL_FAST_MATH = YES;
                  SDKROOT = iphoneos;
                  SWIFT_EMIT_LOC_STRINGS = YES;
                  SWIFT_OPTIMIZATION_LEVEL = "-O";
                  SWIFT_VERSION = 6.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                  VALIDATE_PRODUCT = YES;
                };
                name = Release;
              };
              /* End XCBuildConfiguration section */
              /* Begin XCConfigurationList section */
              1DEB92022A6C1C3F00E4D1E4 /* Build configuration list for PBXProject "SchoolSpaceApp" */ = {
                isa = XCConfigurationList;
                buildConfigurations = (
                  1DEB92002A6C1C3F00E4D1E4,
                  1DEB92012A6C1C3F00E4D1E4,
                );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
              1DEB92152A6C1C3F00E4D1E4 /* Build configuration list for PBXNativeTarget "SchoolSpaceApp" */ = {
                isa = XCConfigurationList;
                buildConfigurations = (
                  1DEB92132A6C1C3F00E4D1E4,
                  1DEB92142A6C1C3F00E4D1E4,
                );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
              /* End XCConfigurationList section */
              /* Begin PBXGroup section */
              1DEB91FD2A6C1C3F00E4D1E4 /* SchoolSpaceApp */ = {
                isa = PBXGroup;
                children = (
                  1DEB92102A6C1C3F00E4D1E4,
                  1DEB920D2A6C1C3F00E4D1E4,
                );
                path = "";
                sourceTree = "<group>";
              };
              1DEB920D2A6C1C3F00E4D1E4 /* Products */ = {
                isa = PBXGroup;
                children = (
                  1DEB920E2A6C1C3F00E4D1E4,
                );
                name = Products;
                sourceTree = "<group>";
              };
              /* End PBXGroup section */
              /* Begin PBXFileReference section */
              1DEB920E2A6C1C3F00E4D1E4 /* SchoolSpaceApp.app */ = {
                isa = PBXFileReference;
                explicitFileType = "wrapper.application";
                includeInIndex = 0;
                path = SchoolSpaceApp.app;
                sourceTree = BUILT_PRODUCTS_DIR;
              };
              1DEB92102A6C1C3F00E4D1E4 /* Sources */ = {
                isa = PBXFileReference;
                lastKnownFileType = "folder";
                name = Sources;
                path = Sources;
                sourceTree = "<group>";
              };
              /* End PBXFileReference section */
              /* Begin PBXNativeTarget section */
              1DEB91FF2A6C1C3F00E4D1E4 /* SchoolSpaceApp */ = {
                isa = PBXNativeTarget;
                buildConfigurationList = 1DEB92152A6C1C3F00E4D1E4;
                buildPhases = (
                  1DEB91FC2A6C1C3F00E4D1E4,
                  1DEB91FD2A6C1C3F00E4D1E4,
                  1DEB91FE2A6C1C3F00E4D1E4,
                );
                buildRules = ();
                dependencies = ();
                name = SchoolSpaceApp;
                productName = SchoolSpaceApp;
                productReference = 1DEB920E2A6C1C3F00E4D1E4;
                productType = "com.apple.product-type.application";
              };
              /* End PBXNativeTarget section */
              /* Begin PBXFrameworksBuildPhase section */
              1DEB91FC2A6C1C3F00E4D1E4 /* Frameworks */ = {
                isa = PBXFrameworksBuildPhase;
                buildActionMask = 2147483647;
                files = ();
                runOnlyForDeploymentPostProcessing = 0;
              };
              /* End PBXFrameworksBuildPhase section */
              /* Begin PBXResourcesBuildPhase section */
              1DEB91FD2A6C1C3F00E4D1E4 /* Resources */ = {
                isa = PBXResourcesBuildPhase;
                buildActionMask = 2147483647;
                files = ();
                runOnlyForDeploymentPostProcessing = 0;
              };
              /* End PBXResourcesBuildPhase section */
              /* Begin PBXSourcesBuildPhase section */
              1DEB91FE2A6C1C3F00E4D1E4 /* Sources */ = {
                isa = PBXSourcesBuildPhase;
                buildActionMask = 2147483647;
                files = (
                );
                runOnlyForDeploymentPostProcessing = 0;
              };
              /* End PBXSourcesBuildPhase section */
              /* Begin PBXVariantGroup section */
              /* End PBXVariantGroup section */
            };
            rootObject = 1DEB91FE2A6C1C3F00E4D1E4;
          }
          EOF

          # Add all Swift files to the project
          find Sources -name "*.swift" | while read file; do
            uuid=$(uuidgen | tr "[:upper:]" "[:lower:]")
            file_ref="1DEB91FF2A6C1C3F00E4D1E4"
            echo "Adding $file to project..."
          done

      - name: Build for iOS device (no signing)
        run: |
          xcodebuild \
            -project SchoolSpaceApp.xcodeproj \
            -scheme SchoolSpaceApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SchoolSpaceApp.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_EMIT_LOC_STRINGS=NO

      - name: Export IPA (unsigned)
        run: |
          mkdir -p build/ExportOptions
          cat > build/ExportOptions/exportOptions.plist << "EOF"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/SchoolSpaceApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Find IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA non trouve"
            find build -name "*.ipa" -o -name "*.app" | head -20
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSpaceApp-ipa
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 7
