name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Xcode project (SPM -> Xcodeproj)
        run: |
          cd Sources
          swift package generate-xcodeproj
          cd ..

      - name: Build for iOS device (no signing)
        run: |
          xcodebuild \
            -project Sources/SchoolSpaceApp.xcodeproj \
            -scheme SchoolSpaceApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SchoolSpaceApp.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_EMIT_LOC_STRINGS=NO

      - name: Export IPA (unsigned)
        run: |
          mkdir -p build/ExportOptions
          cat > build/ExportOptions/exportOptions.plist << "EOF"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/SchoolSpaceApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Find IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA non trouve"
            find build -name "*.ipa" -o -name "*.app" | head -20
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSpaceApp-ipa
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 7
